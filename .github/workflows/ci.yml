name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: congo_knowledge_db
        # don't bind container ports to the host (can fail on GH runners if port in use)
        # services are reachable via localhost without explicit host-port mapping
        # increase healthcheck tolerance to avoid transient init failures on GH runners
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=30s
          --health-retries=30
      redis:
        image: redis:7
        # no host port mapping required for Redis service

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm ci

      - name: Wait for MySQL (install client & poll)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e
          echo "Installing mysql client..."
          sudo apt-get update -y && sudo apt-get install -y default-mysql-client
          echo "Polling for mysql readiness..."
          for i in {1..60}; do
            if mysqladmin ping -h"127.0.0.1" -uroot -p"${DB_PASSWORD}" --silent; then
              echo "mysql ready"; exit 0
            fi
            echo "waiting for mysql... ($i)"; sleep 2
          done
          echo "MySQL did not become ready in time"; exit 1

      - name: Initialize database
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: congo_knowledge_db
        run: node scripts/ci_init_db.js

      - name: Run lint
        run: npm run lint

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: congo_knowledge_db
        run: npm test
